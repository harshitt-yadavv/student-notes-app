<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <header class="masthead">
      <div class="masthead-top">
        <span class="edition"></span>
        <span class="date" id="todayDate"></span>
      </div>
      <h1 class="newspaper-title">The Pomodoro</h1>
      <div class="masthead-rule"></div>
      <p class="tagline">Stay Focused. Study Smarter. Ship More.</p>
      <div class="masthead-rule thin"></div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tab-focus" onclick="switchMode('focus')">● Focus</button>
      <button class="tab" id="tab-short" onclick="switchMode('short')">○ Short Break</button>
      <button class="tab" id="tab-long" onclick="switchMode('long')">○ Long Break</button>
    </div>

    <main class="layout">

      <section class="timer-col">
        <div class="col-head">CURRENT SESSION</div>
        <div class="big-time" id="timeDisplay">25:00</div>
        <div class="mode-line" id="modeLabel">Deep work session</div>

        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <div class="controls">
          <button class="ctrl-icon" onclick="resetTimer()" title="Reset">↺</button>
          <button class="main-btn" id="startBtn" onclick="toggleTimer()">Start</button>
          <button class="ctrl-icon" onclick="skipSession()" title="Skip">⏭</button>
        </div>

        <div class="task-block">
          <div class="task-label">CURRENT TASK</div>
          <div class="task-text" id="taskText">Click edit to set your task</div>
          <input class="task-input hidden" id="taskInput" placeholder="What are you working on?" onkeydown="saveTask(event)" />
          <button
